services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: issue_desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_example_only}
      POSTGRES_DB: issue_desk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - issue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue_desk -d issue_desk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  issue_data:
